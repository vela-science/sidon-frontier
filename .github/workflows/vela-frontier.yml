name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # v0.966.2 ships an action.yml that still invokes `vela check`, a verb its own
      # binary rejects, so the newest release that verifies at all is v0.966.1.
      - uses: vela-science/vela@bf11bc02651c014cd6dd5bf23adf8c651e79559b # v0.966.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
      - name: Reproduce the independent GPT-5.6 Sidon audit
        run: >-
          node verification/verify-sidon-a24-7194.mjs
          artifacts/sidon-a24-gpt56-7194.witness.json |
          diff - verification/sidon-a24-7194.implementation-diverse-verification.json

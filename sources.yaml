# The sources this frontier reconciles.
#
# A Frontier owns its own acquisition inventory. Until this file existed, the
# OEIS dataset locator was a default argument inside the vela-web projection
# pipeline, which meant the web asserted where this Frontier's evidence came
# from and nothing here could contradict it. The Erdős Frontier has declared
# its own sources since the beginning; this is the same file, for this
# Frontier.
#
# `source_id` is the identifier the release-scoped source registry publishes
# under. It lives here rather than in a mapping table downstream, so adding a
# source is one edit in one repository.
#
# `sources.lock.json` records the exact content hash of each entry below. Every
# hash in it is computed by the generator from bytes it fetched or read; none is
# ever hand-written, because a hash nobody computed is worse than no hash at
# all. Regenerate it with:
#     uvx --from "git+https://github.com/vela-science/vela@73d278b0020b1699fcf80749104db19860d1bec2#subdirectory=packages/vela-source-manifest" vela-source-lock
# and check the committed one, without the network, with `--check`.
#
# The generator is the shared `vela-source-manifest` package, which lives at
# `packages/vela-source-manifest` in the vela repository. It used to be a copy
# of that resolver carried here in `scripts/`, one per Frontier: four copies of
# one resolver are four things that can drift apart while every lock still
# looks consistent. The package also ships the two schemas that define the
# shape of this file and of the lock, so a reader in any language can consume
# the definition rather than restate it.
#
# Nothing in this repository is a Python project, so there is no manifest to
# declare the dependency in, and none was created to hold a single line: the
# invocation above is the declaration. It pins a git rev rather than a released
# version because the package is not on PyPI yet; the rev is immutable, so the
# invocation resolves the same bytes from anywhere, with no checkout beside it.
# That pin is read, not merely written: `conformance/frontier_lint.py` in vela
# refuses a generator reference that names anything but a 40-character commit,
# and refuses a Frontier that names two. A manifest would enforce no more than
# that, which is why one was not invented here to hold a line.

sources:
  oeis_a309370:
    source_id: source:oeis-a309370
    kind: sequence_database
    url: https://oeis.org/A309370?fmt=json
    homepage: https://oeis.org/A309370
    # UNPINNED. OEIS serves the current revision of a sequence and offers no
    # immutable locator, so the content root in the lock is the only pin
    # available: this entry locks a sha256 and no commit, because there is no
    # commit to lock. A refresh that changes the source can now be told from one
    # that does not, which is what the root buys.
    #
    # What it does not buy: the first root was computed on 2026-08-06, long
    # after the Claims here were accepted, and no snapshot of the earlier
    # revision was retained. It pins this Frontier's source from now on. It is
    # not evidence about which revision backed the accepted Claims.
    publisher: The OEIS Foundation Inc.
    note: >-
      A published b-file entry is an attributed source fact. It establishes no
      Vela Standing and is not a Verification of any Sidon set bound.

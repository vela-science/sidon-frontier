name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: vela-science/vela@1b051d62bdbd8358c76071e5cfdfb19baf33e2d8 # v0.940.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
          vela-version: v0.940.0
          authority-record-root: ${{ vars.VELA_AUTHORITY_RECORD_ROOT }}
      - name: Reproduce the independent GPT-5.6 Sidon audit
        run: >-
          node verification/verify-sidon-a24-7194.mjs
          artifacts/sidon-a24-gpt56-7194.witness.json |
          diff - verification/sidon-a24-7194.independent-verification.json

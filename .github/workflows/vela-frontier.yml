name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # This job reads the repository and pushes nothing. Full depth is what
          # `vela replay` needs; the token is not, and leaving it in .git/config
          # only gives every later step a credential it has no use for.
          persist-credentials: false
      - uses: vela-science/vela@c4023f111ee88f92e6e3c7b47699499a46e83940 # v0.966.4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
      # This Frontier has no test suite and needs none: the verifier re-derives
      # all 25,880,415 unordered pair sums, applies its own bound adversarial
      # mutation and requires that to be rejected, and the retained report it is
      # diffed against carries the verifier's own source digest. Editing either
      # side breaks the diff.
      #
      # `set -o pipefail` because the exit status of `a | b` is b's. Without it
      # this step passed on whatever `diff` concluded and the verifier's own
      # status was discarded; it happened to still fail, because a verifier that
      # throws writes nothing and empty does not match the retained report. That
      # is an argument, not a guarantee, and one line replaces it.
      - name: Reproduce the independent GPT-5.6 Sidon audit
        run: |
          set -euo pipefail
          node verification/verify-sidon-a24-7194.mjs \
            artifacts/sidon-a24-gpt56-7194.witness.json \
            | diff - verification/sidon-a24-7194.implementation-diverse-verification.json

# The sources this frontier reconciles.
#
# A Frontier owns its own acquisition inventory. Until this file existed, the
# OEIS dataset locator was a default argument inside the vela-web projection
# pipeline, which meant the web asserted where this Frontier's evidence came
# from and nothing here could contradict it. The Erdős Frontier has declared
# its own sources since the beginning; this is the same file, for this
# Frontier.
#
# `source_id` is the identifier the release-scoped source registry publishes
# under. It lives here rather than in a mapping table downstream, so adding a
# source is one edit in one repository.
#
# No `sources.lock.json` exists here yet. When an acquisition run generates one
# it records the exact content hash of each entry; it is never hand-written,
# because a hash nobody computed is worse than no hash at all.

sources:
  oeis_a309370:
    source_id: source:oeis-a309370
    kind: sequence_database
    url: https://oeis.org/A309370?fmt=json
    homepage: https://oeis.org/A309370
    # UNPINNED, and currently unrecorded. OEIS serves the current revision of a
    # sequence and offers no immutable locator, so the retained content root is
    # the only pin available — and the lock that would hold it has not been
    # generated, so the revision behind the accepted Claims is written down
    # nowhere. Until an acquisition run produces that root, a refresh that
    # changes the source cannot be told from one that does not.
    publisher: The OEIS Foundation Inc.
    note: >-
      A published b-file entry is an attributed source fact. It establishes no
      Vela Standing and is not a Verification of any Sidon set bound.
